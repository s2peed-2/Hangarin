{% extends 'base.html' %}
{% block title %}Confirm Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h4 class="mb-3">Confirm Sign In</h4>
        <p>You are about to sign in using your <strong>{{ provider.name }}</strong> account.</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary w-100 mb-2">Continue with {{ provider.name }}</button>
        </form>

        <a href="{% url 'account_login' %}" class="btn btn-outline-secondary w-100">Cancel</a>
    </div>
</div>
{% endblock %}
