{% extends 'base.html' %}
{% block title %}Categories{% endblock %}
{% block content %}
<h4>Categories</h4>
<form method="get" class="row g-2 mb-3">
    <div class="col-auto"><input type="text" name="q" value="{{ request.GET.q }}" placeholder="Search categories..." class="form-control"></div>
    <div class="col-auto"><button type="submit" class="btn btn-primary">Search</button></div>
</form>
<table class="table table-striped">
    <thead><tr><th>Name</th></tr></thead>
    <tbody>
        {% for category in categories %}
        <tr><td>{{ category.name }}</td></tr>
        {% empty %}
        <tr><td>No categories found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
